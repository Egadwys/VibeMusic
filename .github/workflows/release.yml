name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi release (contoh: 1.0.1)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk "VibeMusic-v${VERSION}.apk"
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: VibeMusic v${{ inputs.version }}
          files: VibeMusic-v${{ inputs.version }}.apk
          generate_release_notes: true
